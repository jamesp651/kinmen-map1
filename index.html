<html lang="zh-TW">

    <title>2026 金門迎城隍 - 即時勤務系統</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

        /* 身份選擇遮罩層樣式 */
        #roleOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; padding: 20px; box-sizing: border-box;
        }
        .role-box {
            background: white; color: #333; padding: 30px; border-radius: 16px;
            max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .role-box h2 { margin-top: 0; color: #d32f2f; font-size: 24px; margin-bottom: 20px; }
        .btn-role {
            display: block; width: 100%; padding: 15px; margin: 12px 0;
            font-size: 16px; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-role-frontend { background: #FF9800; color: white; }
        .btn-role-frontend:hover { background: #e65100; }
        .btn-role-backend { background: #0d47a1; color: white; }
        .btn-role-backend:hover { background: #0a3580; }

        /* 管理面板外框 */
        .control-panel {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(255,255,255,0.98); border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            width: 300px; transition: all 0.3s ease;
            max-height: 90vh; display: flex; flex-direction: column;
        }
        .control-panel.minimized { width: 160px; height: 42px; overflow: hidden; }

        .panel-header {
            padding: 10px; display: flex; justify-content: space-between; align-items: center;
            background: #d32f2f; color: white; border-radius: 12px 12px 0 0; cursor: pointer;
        }

        .panel-content { padding: 12px; overflow-y: auto; }
        .control-panel.minimized .panel-content { display: none; }

        /* 直播顯示區塊 */
        .video-container {
            width: 100%;
            background: #000;
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #d32f2f;
            aspect-ratio: 16 / 9;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* 按鈕與文字樣式 */
        button { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .btn-toggle { background: none; color: white; width: auto; margin: 0; padding: 2px 5px; font-size: 12px; border: 1px solid white; }
        .btn-admin { background: #FF9800; color: white; }
        .btn-tail { background: #4CAF50; color: white; }
        .btn-clear-path { background: #607D8B; color: white; font-size: 12px; margin-top: 10px; }
        .btn-reset { width: auto; padding: 2px 8px; font-size: 11px; background: #f5f5f5; color: #999; border: 1px solid #ddd; margin: 0; }
        
        .live-clock { background: #b71c1c; color: #fff; text-align: center; font-size: 14px; padding: 4px 0; font-family: monospace; }
        .dist-info { font-size: 14px; color: #d32f2f; text-align: center; font-weight: bold; margin: 5px 0; }
        .status-info { font-size: 11px; text-align: center; color: #666; margin-bottom: 10px; }

        /* 長官回報區 */
        .report-section { margin-top: 10px; padding-top: 8px; border-top: 2px solid #eee; }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .report-title { font-size: 14px; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .report-item { display: flex; flex-direction: column; align-items: center; background: #f9f9f9; padding: 5px; border-radius: 4px; }
        .btn-report { padding: 6px 2px; font-size: 12px; background: #fff; border: 1px solid #ddd; width: 100%; }
        .btn-arrived { border-bottom: 3px solid #4CAF50; }
        .btn-left { border-bottom: 3px solid #f44336; }
        .time-label { font-size: 18px; color: #d32f2f; font-weight: 900; font-family: Arial; margin-top: 2px; }

        /* 地圖標記 */
        .marker-icon { display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; background: white; border: 2px solid #d32f2f; border-radius: 50%; font-size: 24px; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .god-marker { border-color: #d32f2f; animation: pulse 2s infinite; }
        .tail-marker { border-color: #4CAF50; font-size: 20px; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(211, 47, 47, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(211, 47, 47, 0); } 100% { box-shadow: 0 0 0 0px rgba(211, 47, 47, 0); } }

        /* 警察交通指揮點位圖示樣式 */
        .police-marker {
            display: flex; justify-content: center; align-items: center;
            width: 28px; height: 28px; background: #ffffff;
            border: 2px solid #0d47a1; border-radius: 50%;
            font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>

<div id="roleOverlay">
    <div class="role-box">
        <h2>2026 金門迎城隍<br>即時勤務系統</h2>
        <p style="color:#666; font-size:14px; margin-bottom:20px;">請選擇您的操作身份進入系統</p>
        <button class="btn-role btn-role-backend" onclick="selectRole('backend')">💻 後端勤指中心人員</button>

</div>

        <div id="statusText" class="status-info">等待定位數據...</div>

        <button id="adminBtn" class="btn-admin" onclick="toggleAdminMode()" style="display: none;">📡 神轎位置回報 (頭)</button>

        godPos = [lat, lng];
        palanquinMarker.setLatLng(godPos);
        passedPath.addLatLng(godPos);
        updateDistance();
    }

    function updateDistance() {
        if (godPos && tailPos) {
            const d = L.latLng(godPos).distanceTo(L.latLng(tailPos));
            document.getElementById('distanceText').innerText = `隊伍長度: ${Math.round(d)} 公尺`;
        }
    }

    db.ref('palanquin/location').on('value', (s) => {
        const d = s.val();
        if(d) {
            syncPalanquin(d.lat, d.lng);
            document.getElementById('statusText').innerText = "最後更新: " + new Date(d.timestamp).toLocaleTimeString();
        }
    });

    db.ref('palanquin/tail').on('value', (s) => {
        const d = s.val();
        if(d) {
            tailPos = [d.lat, d.lng];
            tailMarker.setLatLng(tailPos).setOpacity(1);
            updateDistance();
        }
    });

    // 6. 功能按鈕與介面控制
    function togglePanel() {
        const panel = document.getElementById('mainPanel');
        panel.classList.toggle('minimized');
        document.getElementById('toggleBtn').innerText = panel.classList.contains('minimized') ? "展開" : "收合";
        
        setTimeout(() => { map.invalidateSize(); }, 350);
    }

    function clearRoutePath() {
        if (confirm("確定要重整地圖上的行走軌跡嗎？")) db.ref('system/pathReset').set(Date.now());
    }
    db.ref('system/pathReset').on('value', () => passedPath.setLatLngs([]));

    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleString();
    }
    setInterval(updateClock, 1000);

    // 7. 長官系統
    const officials = ['縣長', '李副縣長', '陳副縣長', '議長', '副議長'];
    function initGrids() {
        const arrGrid = document.getElementById('arrivalGrid');
        const depGrid = document.getElementById('departureGrid');
         officials.forEach(p => {
            const shortName = p.replace('副縣長','副縣');
            arrGrid.innerHTML += `<div class="report-item"><button class="btn-report btn-arrived" onclick="reportStatus('${p}','蒞')">${shortName}</button><span id="t-${p}-蒞" class="time-label">--:--</span></div>`;
            depGrid.innerHTML += `<div class="report-item"><button class="btn-report btn-left" onclick="reportStatus('${p}','離')">${shortName}</button><span id="t-${p}-離" class="time-label">--:--</span></div>`;
        });
    }
    initGrids();

    function reportStatus(p, k) {
        if(confirm(`確認更新 ${p} 的時間？`)) db.ref(`officials/${p}/${k}`).set({ ts: Date.now() });
    }

    function resetSection(k) {
        if(confirm("確定清空？")) {
            officials.forEach(p => db.ref(`officials/${p}/${k}`).remove());
        }
    }

    db.ref('officials').on('value', (s) => {
        const data = s.val() || {};
        officials.forEach(p => {
            ['蒞', '離'].forEach(k => {
                const el = document.getElementById(`t-${p}-${k}`);
                if(data[p] && data[p][k]) {
                    const t = new Date(data[p][k].ts);
                    el.innerText = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
                } else { el.innerText = "--:--"; }
            });
        });
    });

    // 8. 定位發送模式 (管理端)
    let isAdmin = false, isTail = false, watchH = null, watchT = null;
    function toggleAdminMode() {
        isAdmin = !isAdmin;
        const btn = document.getElementById('adminBtn');
        if(isAdmin) {
            btn.style.background = "#f44336"; btn.innerText = "🛑 停止發送(頭)";
            watchH = navigator.geolocation.watchPosition(p => {
                db.ref('palanquin/location').set({ lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now() });
            }, null, { enableHighAccuracy: true });
        } else {
            btn.style.background = "#FF9800"; btn.innerText = "📡 神轎位置回報 (頭)";
            navigator.geolocation.clearWatch(watchH);
        }
    }

    function toggleTailMode() {
        isTail = !isTail;
        const btn = document.getElementById('tailBtn');
        if(isTail) {
            btn.style.background = "#f44336"; btn.innerText = "🛑 停止回報(尾)";
            watchT = navigator.geolocation.watchPosition(p => {
                db.ref('palanquin/tail').set({ lat: p.coords.latitude, lng: p.coords.longitude, timestamp: Date.now() });
            }, null, { enableHighAccuracy: true });
        } else {
            btn.style.background = "#4CAF50"; btn.innerText = "🚩 隊伍尾端回報 (尾)";
            navigator.geolocation.clearWatch(watchT);
        }
    }

    // 9. 具備密碼驗證的權限選擇控制邏輯
    function selectRole(role) {
        const adminBtn = document.getElementById('adminBtn');
        const tailBtn = document.getElementById('tailBtn');
        
        if (role === 'frontend') {
            // 要求輸入前端定位密碼
            const password = prompt("請輸入前端神轎定位人員密碼：");
            if (password === "12345678") {
                // 密碼正確：開啟定位回報功能
                adminBtn.style.display = "block";
                tailBtn.style.display = "block";
            } else {
                // 密碼錯誤或取消：拒絕進入並停留在首頁
                alert("密碼錯誤，拒絕存取定位功能！");
                return; 
            }
        } else if (role === 'backend') {
            // 後端勤指人員：直接進入，但隱藏定位按鈕，確保完全無法誤觸
            adminBtn.style.display = "none";
            tailBtn.style.display = "none";
        }
        
        // 驗證通過或選擇後端後，隱藏身份選擇遮罩層
        document.getElementById('roleOverlay').style.display = "none";
        
        // 重新計算地圖容器尺寸以防止圖層破損
        map.invalidateSize();
    }

    window.onload = function() {
        map.invalidateSize();
    };
</script>
</body>
</html>
